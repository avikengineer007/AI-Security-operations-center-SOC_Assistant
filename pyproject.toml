[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-assistant"
version = "0.1.0"
description = "AI-powered SOC analyst CLI tool using Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
soc-assistant = "soc_assistant.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["soc_assistant*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
